<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmar Envio</title>
    <link rel="stylesheet" href="assets/tailwind.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <script src="vendor/walletconnect-ethereum-provider/index.umd.js"></script>
    <script src="env.js"></script>
    <style>
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div class="max-w-xl mx-auto p-6">
      <h1 class="text-2xl font-semibold mb-4">Assinar transferência</h1>
      <div id="details" class="p-4 rounded bg-slate-800 mb-4"></div>
      <div class="flex gap-2 mb-3">
        <button id="connect" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">Conectar Carteira</button>
        <button id="send" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded" disabled>Enviar</button>
      </div>
      <div id="status" class="text-sm opacity-90 min-h-[1.5rem]"></div>
    </div>
    <script>
      (function(){
        const qs = new URLSearchParams(location.search);
        const to = (qs.get('to')||'').trim();
        const amount = (qs.get('amount')||'').trim();
        const token = (qs.get('token')||'').trim();
        const details = document.getElementById('details');
        function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
        details.innerHTML = '<div class="space-y-1">'
          + '<div><span class="opacity-70">Token</span> <code class="text-emerald-300">'+esc(token)+'</code></div>'
          + '<div><span class="opacity-70">Destinatário</span> <code class="text-emerald-300">'+esc(to)+'</code></div>'
          + '<div><span class="opacity-70">Valor</span> <strong>'+esc(amount)+'</strong></div>'
          + '</div>';

        const erc20Abi = [
          'function transfer(address to, uint256 value) returns (bool)',
          'function decimals() view returns (uint8)'
        ];

        const status = document.getElementById('status');
        function setStatus(m){ status.textContent = m; }

        let browserProvider = null;
        let signer = null;

        async function connect() {
          try {
            if (window.ethereum) {
              browserProvider = new ethers.BrowserProvider(window.ethereum);
              await browserProvider.send('eth_requestAccounts', []);
            } else if (window.WalletConnectEthereumProvider) {
              const chainId = 42220; // CELO mainnet by default
              const WC = window.WalletConnectEthereumProvider;
              const wc = await WC.init({ projectId: (window.WC_PROJECT_ID||'demo'), chains: [chainId], showQrModal: true });
              await wc.connect();
              browserProvider = new ethers.BrowserProvider(wc);
            } else {
              setStatus('Nenhuma carteira detectada. Instale MetaMask ou use WalletConnect.');
              return;
            }
            signer = await browserProvider.getSigner();
            const addr = await signer.getAddress();
            setStatus('Conectado: '+addr);
            document.getElementById('send').disabled = false;
          } catch (e) {
            setStatus('Falha ao conectar: '+(e && e.message || e));
          }
        }

        async function send() {
          try {
            if (!signer) { setStatus('Conecte sua carteira primeiro'); return; }
            if (!/^0x[a-fA-F0-9]{40}$/.test(token)) { setStatus('Endereço de token inválido'); return; }
            if (!/^0x[a-fA-F0-9]{40}$/.test(to)) { setStatus('Endereço do destinatário inválido'); return; }
            const c = new ethers.Contract(token, erc20Abi, signer);
            const dec = await c.decimals().catch(()=>18);
            const value = ethers.parseUnits(String(amount), Number(dec));
            setStatus('Enviando transação...');
            const tx = await c.transfer(to, value);
            setStatus('Aguardando confirmação...');
            const rc = await tx.wait();
            const h = (rc && rc.hash) || tx.hash;
            setStatus('Sucesso! Tx: '+h);
          } catch (e) {
            setStatus('Erro ao enviar: '+(e && e.message || e));
          }
        }

        document.getElementById('connect').addEventListener('click', connect);
        document.getElementById('send').addEventListener('click', send);
      })();
    </script>
  </body>
  </html>
